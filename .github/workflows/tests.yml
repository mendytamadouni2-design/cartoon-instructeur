# Tests de bout en bout à chaque mise à jour : une erreur ne peut plus arriver sur le téléphone sans être vue.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les outils de test
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Vérifier la syntaxe
        run: |
          node --input-type=module --check < relais/cloudflare-worker.js
          node --check sw.js
      - name: Tests du moteur de motion design
        run: node tests/unit-motion.js
      - name: Lancer les tests
        working-directory: tests
        run: node run-e2e.js
